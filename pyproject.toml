[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudcam"
version = "0.2.0"
description = "EZVIZ / Hik-Connect bulut kameralariga kirish va shifrlangan oqimlarni deshifrlash (H.264/H.265, RTP + MPEG-PS)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"  # pyezvizapi 1.0.5.0 requires it
keywords = ["ezviz", "hik-connect", "hikvision", "cctv", "rtsp", "camera", "hevc", "decrypt"]
authors = [{ name = "Bahrombek" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Multimedia :: Video",
    "Operating System :: OS Independent",
]
# Pinned: this package handles the cloud account password and the cameras'
# video keys, so an upgrade is a code review, not a side effect of `pip install`.
# pyezvizapi 1.0.5.0 is the version audited (sdist sha256 0f7346a1...73a3).
dependencies = [
    "pyezvizapi==1.0.5.0",
    "numpy==2.1.3",
    "requests==2.32.3",
    "pycryptodome==3.21.0",
]

[project.optional-dependencies]
# Ko'rish (OpenCV) ixtiyoriy — yadro headless ishlaydi.
viewer = ["opencv-python"]
dev = ["pytest", "ruff"]

[project.urls]
Homepage = "https://github.com/Bahrombekk/cloud-cam-viewer"
Source = "https://github.com/Bahrombekk/cloud-cam-viewer"

[project.scripts]
# `pip install` dan keyin buyruq sifatida ishlatiladi.
cloudcam = "cloudcam.cli:main"

[tool.setuptools]
packages = ["cloudcam"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
